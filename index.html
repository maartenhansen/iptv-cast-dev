<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b45309">
  <title>IPTV Cast DEV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" aria-label="Terug" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">IPTV Cast</h1>
    <google-cast-launcher id="castbtn" aria-label="Casten"></google-cast-launcher>
  </header>

  <main id="view"></main>

  <section id="mini" hidden aria-label="Speelt nu af op tv">
    <div class="mini-row">
      <div class="mini-img"><img id="mini-img" alt=""></div>
      <div class="mini-text">
        <div id="mini-title"></div>
        <div id="mini-time" class="muted"></div>
      </div>
    </div>
    <input type="range" id="mini-seek" min="0" max="100" value="0" step="1" aria-label="Positie">
    <div class="mini-ctrls">
      <button data-act="vol-" aria-label="Zachter">−🔊</button>
      <button data-act="back" aria-label="10 seconden terug">−10</button>
      <button data-act="play" class="big" aria-label="Afspelen/pauze">⏸</button>
      <button data-act="fwd" aria-label="30 seconden vooruit">+30</button>
      <button data-act="vol+" aria-label="Luider">+🔊</button>
      <button data-act="cc" aria-label="Ondertitels">CC</button>
      <button data-act="stop" aria-label="Stoppen">■</button>
    </div>
  </section>

  <nav class="tabs">
    <button data-tab="live"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M9 3l3 3 3-3"/></svg><span>Live</span></button>
    <button data-tab="vod"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M10 9l5 3-5 3z"/></svg><span>Films</span></button>
    <button data-tab="series"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M6 4h12"/></svg><span>Series</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Instellingen</span></button>
  </nav>

  <div id="sheet" hidden><div class="sheet-box"></div></div>
  <div id="toast" role="status" hidden></div>

  <script src="app.js"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<div style="position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:56px;z-index:50;background:#b45309;color:#fff;font:700 11px system-ui;padding:3px 7px;border-radius:6px">DEV 680b3d3</div>
</body>
</html>
